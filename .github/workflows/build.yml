name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: xinput1_3
          path: build/Release/xinput1_3.dll
